services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renewable_platform}
      POSTGRES_USER: ${POSTGRES_USER:-renewable_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renewable_pass}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renewable_user} -d ${POSTGRES_DB:-renewable_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-renewable_user}:${POSTGRES_PASSWORD:-renewable_pass}@db:5432/${POSTGRES_DB:-renewable_platform}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-solar_wind_deployment_intelligence_secret_key_2026}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
 
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    command: >
      sh -c "echo 'Frontend running on http://localhost:3000 (Press CTRL+C to quit)' &&
      nginx -g 'daemon off;'"
 
volumes:
  db_data: