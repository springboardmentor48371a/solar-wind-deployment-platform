<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Solar & Wind Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">

        <h1>🌱 Solar & Wind Platform</h1>

        <h2>Create Account</h2>

        <input id="fullName" type="text" placeholder="Full Name">

        <input id="email" type="email" placeholder="Email">

        <input id="password" type="password" placeholder="Password">

        <input id="phoneNumber" type="text" placeholder="Phone Number">

        <input id="organization" type="text" placeholder="Organization">

        <button onclick="registerUser()">
            Register
        </button>

        <p id="registerMessage"></p>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>


    <script>

        async function registerUser() {

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const phoneNumber =
                document.getElementById("phoneNumber").value.trim();

            const organization =
                document.getElementById("organization").value.trim();


            // Basic validation

            if (!fullName || !email || !password) {

                document.getElementById("registerMessage").innerText =
                    "Please fill Full Name, Email and Password.";

                return;
            }


            const data = {

                full_name: fullName,

                email: email,

                password: password,

                phone_number: phoneNumber,

                organization: organization

            };


            try {

                document.getElementById("registerMessage").innerText =
                    "Creating account...";


                const response = await fetch(
                    "http://localhost:8000/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );


                const result = await response.json();


                console.log("Register response:", result);


                if (response.ok && result.status === "success") {

                    document.getElementById("registerMessage").innerText =
                        "Registration successful!";

                    alert("Registration successful!");

                    window.location.href =
                        "login.html";

                }

                else {

                    document.getElementById("registerMessage").innerText =
                        result.message ||
                        "Registration failed.";

                }

            }

            catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                document.getElementById("registerMessage").innerText =
                    "Could not connect to FastAPI. Make sure the backend is running.";

            }

        }

    </script>

</body>

</html>
