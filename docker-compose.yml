services:
  db:
    image: postgres:16-alpine
    container_name: solar_wind_db_container
    restart: always
    environment:
      POSTGRES_DB: solar_wind_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: solar_wind_backend_container
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/solar_wind_db
      - JWT_SECRET_KEY=solar_wind_intelligence_secret_key_change_in_production_32bytes
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=1440
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: solar_wind_frontend_container
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
    driver: local
