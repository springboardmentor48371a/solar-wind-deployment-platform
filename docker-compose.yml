services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: solarwind
      POSTGRES_PASSWORD: solarwind123
      POSTGRES_DB: solarwind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarwind -d solarwind_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://solarwind:solarwind123@db:5432/solarwind_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  ml-service:
    build: ./ml-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://solarwind:solarwind123@db:5432/solarwind_db
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      GEE_KEY_PATH: ${GEE_KEY_FILE:-}
      GEE_PROJECT: ${GEE_PROJECT:-astral-pipe-508512-s9}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml-service:/app

volumes:
  postgres_data:
