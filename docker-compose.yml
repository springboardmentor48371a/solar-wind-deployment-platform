version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solar_wind_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite database so data is not lost on restart
      - backend_data:/app/data
    environment:
      - PORT=8000
    networks:
      - platform_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solar_wind_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - platform_network

volumes:
  backend_data:

networks:
  platform_network:
    driver: bridge